[package]
name = "review-core"
version = "0.1.0"
edition = "2021"

[dependencies]
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
